[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cubetrainer-backend"
version = "0.1.0"
description = "Local-first CubeTrainer backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121,<1.0",
    "uvicorn>=0.38,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.4,<10.0",
    "ruff>=0.14,<1.0",
    "mypy>=1.18,<2.0",
    "build>=1.3,<2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
